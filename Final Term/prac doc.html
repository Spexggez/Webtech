
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-commerce Exam</title>
    <link rel="stylesheet" href="style.css">

    <style>
    body {
    margin: 0;
    padding-bottom: 60px; /* Leaves space for the fixed footer */
    font-family: Arial, sans-serif;
}


header {
    text-align: center;
    background-color: #f1f1f1;
    padding: 15px;
}


.form-wrapper {
    display: flex;
    padding: 10px;
    gap: 10px;
}

/* Make sure both forms take up roughly half the screen */
form {
    width: 60%;
}

fieldset {
    padding: 10px;
    border: 1px solid #333;
}

/* Fixed footer at the bottom */
footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    text-align: center;
    background-color: #333;
    color: white;
    padding: 15px 0;
    
}

footer:hover{
    background-color: blue;
}

/* Utility class to hide elements */
.hidden {
 display:none;
}

/* Inputs styling */
textarea, select, input[type="number"] {
    width: 100%;
    margin-top: 10px;
}
</style>
</head>
<body>

    <header>
        <h1>My E-commerce Site</h1>
    </header>
    <div class="form-wrapper">
        <form id="cartForm">
            <fieldset>
                <legend>Add to Cart</legend>
                <p>Product: Wireless Mouse</p>
                <p>Unit Price: <span id="unitPrice">1000</span> Tk</p>
                <label for="qty">Quantity:</label>
                <input type="number" id="qty" value="1" min="1">
                
                <p>Total Price: <span id="totalPrice">1000</span> Tk</p>
                <p id="couponMsg" class="hidden" style="color: green;">You are now eligible for a coupon.</p>
            </fieldset>
        </form>

        <!-- Form 2: Checkout -->
        <form id="checkoutForm" method="post">
            <fieldset>
                <legend>Checkout form</legend>
                <label for="address">Shipping Address:</label><br>
                <textarea id="address" rows="3" placeholder="Enter full address" required></textarea><br><br>
                <label for="delivery">Delivery Option:</label>
                <select id="delivery">
                    <option value="50">Delivery Inside Dhaka (50 Tk)</option>
                    <option value="120">Delivery Outside Dhaka (120 Tk)</option>
                </select>
                
                <p>Final Total (incl. Delivery): <span id="finalTotal">1050</span> Tk</p>
                
                <input type="checkbox" id="terms">
                <label for="terms">I agree to all the terms and conditions</label><br><br>
                
                <button type="submit" id="submitBtn" class="hidden">Submit</button>
            </fieldset>
        </form>

    </div>

    <!-- Footer requirement -->
    <footer>Copyright@2026</footer>

    <!-- Linking external JavaScript -->
    <script>const UNIT_PRICE = 1000;
const THRESHOLD = 3000; // Let's say spending more than 3000 Tk gets a coupon

// Grab all necessary DOM elements
const qtyInput = document.getElementById('qty');
const totalPriceDisplay = document.getElementById('totalPrice');
const couponMsg = document.getElementById('couponMsg');
const deliverySelect = document.getElementById('delivery');
const finalTotalDisplay = document.getElementById('finalTotal');
const termsCheckbox = document.getElementById('terms');
const submitBtn = document.getElementById('submitBtn');

// Function to calculate and update all prices
function calculateTotals() {
    let quantity = parseInt(qtyInput.value);

    // Requirement: Quantity cannot be zero or negative
    if (quantity <= 0 || isNaN(quantity)) {
        quantity = 1;
        qtyInput.value = 1; // Force the UI back to 1
        alert("Quantity must be at least 1.");
    }

    // Calculate base total
    let baseTotal = quantity * UNIT_PRICE;
    totalPriceDisplay.textContent = baseTotal;

    // Requirement: Check threshold for coupon
    if (baseTotal > THRESHOLD) {
        couponMsg.style.display = 'block';
    } else {
        couponMsg.style.display = 'none';
    }

    // Requirement: Add delivery charge to final total
    let deliveryCharge = parseInt(deliverySelect.value);
    let finalTotal = baseTotal + deliveryCharge;
    finalTotalDisplay.textContent = finalTotal;
}


qtyInput.addEventListener('input', calculateTotals);

deliverySelect.addEventListener('change', calculateTotals);

// Requirement: Submit button visibility toggle
termsCheckbox.addEventListener('change', function() {
    if (termsCheckbox.checked) {
        submitBtn.style.display = 'inline-block'; 
    } else {
        submitBtn.style.display = 'none'; 
    }
});

calculateTotals(); </script>
</body>
</html>
